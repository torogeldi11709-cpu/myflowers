<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог искусственных цветов</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#ff7aa2;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin:20px 0;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.price{
    color:#e91e63;
    font-size:22px;
    font-weight:bold;
}
</style>

</head>
<body>

<header>
<h1>🌸 Каталог искусственных цветов 🌸</h1>
<p>Выберите понравившийся товар</p>
</header>

<div class="container">

<div class="card">
<h2>🌹 Искусственная роза</h2>
<p class="price">350 ₽</p>
</div>

<div class="card">
<h2>🌷 Искусственный тюльпан</h2>
<p class="price">180 ₽</p>
</div>

<div class="card">
<h2>🌸 Искусственный пион</h2>
<p class="price">420 ₽</p>
</div>

</div>

</body>
</html>
